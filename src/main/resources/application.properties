# Configuración común a los dos servicios. El nombre de cada servicio y sus propiedades
# propias están en application-pedidos.properties y application-inventario.properties.
spring.application.name=tienda

# ---------- Actuator ----------
# Endpoints expuestos por HTTP: salud, información y métricas en formato Prometheus.
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.probes.enabled=true

# ---------- Métricas (Micrometer + Prometheus) ----------
# Etiqueta común en todas las métricas: permite filtrar por servicio en PromQL y en Grafana.
management.metrics.tags.application=${spring.application.name}
# Publica los buckets del histograma de http.server.requests: necesarios para calcular el p95.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
# El starter de OpenTelemetry también trae un exportador OTLP de métricas. En este taller
# Prometheus lee las métricas (pull), así que se desactiva el envío por OTLP (push).
management.otlp.metrics.export.enabled=false

# ---------- Trazas (Micrometer Tracing + OpenTelemetry -> OTLP -> Jaeger) ----------
# 1.0 = se registran todas las peticiones. Por defecto Spring Boot solo muestrea el 10%.
management.tracing.sampling.probability=1.0
# Destino OTLP por HTTP (puerto 4318). En Docker Compose se reemplaza por http://jaeger:4318/v1/traces.
management.opentelemetry.tracing.export.otlp.endpoint=${OTLP_TRACES_ENDPOINT:http://localhost:4318/v1/traces}

# ---------- Logs ----------
# No hace falta configurar nada: mientras hay una traza activa, Spring Boot agrega a cada línea
# de log el bloque [traceId-spanId]. Ver la sección "Correlación de logs y trazas" del README.
