# Servicio de pedidos: recibe los pedidos y llama al servicio de inventario.
spring.application.name=pedidos
server.port=8081

# URL base del servicio de inventario. En Docker Compose: http://inventario:8082
inventario.url=${INVENTARIO_URL:http://localhost:8082}

# Tiempos máximos de las llamadas HTTP salientes (RestClient).
spring.http.clients.connect-timeout=1s
spring.http.clients.read-timeout=3s
